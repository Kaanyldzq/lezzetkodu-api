spring:
  application:
    name: lezzetkodu-api
  datasource:
    # Degerler ortam degiskenlerinden gelir; yoksa yerel gelistirme varsayilanlari kullanilir.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lezzetkodu}
    username: ${DB_USERNAME:lezzetkodu}
    password: ${DB_PASSWORD:lezzetkodu}
    hikari:
      # Ucretsiz bulut veritabanlarinda baglanti sayisi sinirli; kucuk bir havuz yeterli.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Semayi Hibernate degil Flyway olusturur; Hibernate sadece entity'lerle uyumlu mu diye kontrol eder.
    hibernate:
      ddl-auto: validate
    # Veritabani baglantisini HTTP istegi boyunca acik tutmayi kapatir (gizli N+1 sorgularini onler).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  web:
    # Validation mesajlari ("bos olamaz" vb.) sunucunun dilinden bagimsiz olarak Turkce doner.
    locale: tr_TR
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  # Bulutta HTTPS'i onumuzdeki proxy (Render) karsilar; X-Forwarded-* basliklarina bakarak
  # uygulama kendi adresini https://... olarak bilir (Swagger ve Location basligi dogru olur).
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

app:
  jwt:
    # Zorunlu. Uretmek icin: openssl rand -base64 32
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  admin:
    # Ikisi de verilirse uygulama acilirken bu admin kullanicisi yoksa olusturulur.
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:admin@lezzetkodu.local}
    password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
