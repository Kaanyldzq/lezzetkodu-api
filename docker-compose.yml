# Tek komutla API + PostgreSQL:  docker compose up -d --build
# Degerler ayni klasordeki .env dosyasindan okunur (.env.example'i kopyalayip doldur).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Container silinse bile veriler bu volume'da kalir.
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # API'nin, veritabani gercekten baglanti kabul etmeye baslayinca acilmasi icin saglik kontrolu.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Compose agindaki "db" ismi, veritabani container'inin adresi olur.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
